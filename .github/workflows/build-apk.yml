name: Build PhoneVPS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify build Python
        run: python3.11 --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Test Rust core
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Build standalone Rust CLI binary
        run: cargo build --manifest-path rust/Cargo.toml --release --bin phonevps-cli

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust native libraries for Android
        working-directory: rust
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
            NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          export ANDROID_NDK_HOME="$NDK_DIR"
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --lib --release

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "PHONEVPS_KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
            echo "PHONEVPS_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "PHONEVPS_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "PHONEVPS_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore release.keystore -alias phonevps \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass phonevps-ci-pass -keypass phonevps-ci-pass \
              -dname "CN=PhoneVPS, O=PhoneVPS, C=US"
            echo "PHONEVPS_KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
            echo "PHONEVPS_KEYSTORE_PASSWORD=phonevps-ci-pass" >> "$GITHUB_ENV"
            echo "PHONEVPS_KEY_ALIAS=phonevps" >> "$GITHUB_ENV"
            echo "PHONEVPS_KEY_PASSWORD=phonevps-ci-pass" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease

      - name: Stage release files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/PhoneVPS-v${{ steps.version.outputs.name }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/PhoneVPS-v${{ steps.version.outputs.name }}-release.apk"
          cp rust/target/release/phonevps-cli "dist/phonevps-cli-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneVPS-APKs
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: PhoneVPS v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            dist/PhoneVPS-v${{ steps.version.outputs.name }}-release.apk
            dist/PhoneVPS-v${{ steps.version.outputs.name }}-debug.apk
            dist/phonevps-cli-linux-x86_64
